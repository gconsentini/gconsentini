name: Metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# The action commits its output, so a push trigger lets one run start while
# another is still writing. Overlapping runs then race on the same file and
# fail with "does not match <sha>". Serialise instead.
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      HAS_WAKATIME: ${{ secrets.WAKATIME_TOKEN != '' }}
    steps:
      # Languages across personal AND organisation repositories.
      #
      # Indepth mode clones each repository onto the runner and runs linguist
      # over `git log` to count only lines Gustavo actually authored. Without
      # it, including the org would credit him with the whole LendingHome
      # codebase — the same overstatement the elasticsearch fork produced.
      #
      # Nothing is written to any analysed repository; clones are read-only and
      # die with the runner. Only aggregate percentages are published.
      #
      # Timeouts bound the run: indepth is slow and the org has 100+ repos.
      # A timeout yields partial analysis rather than a failed workflow.
      #
      # Forks are still skipped. The elasticsearch fork alone is 558 MB of
      # someone else's Java, which is what made every earlier chart report Java.
      - name: Languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gconsentini
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_categories: programming
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_skipped: >-
            elasticsearch,
            RO-calculator,
            calculadoras-ragnarok,
            learn-react,
            challenge-bravo,
            teamsnap-mega-tournament,
            resume,
            GordoKore-relay-work,
            GameJam,
            dontCARE

      # Coding time per language, measured in the editor rather than from
      # repository metadata. This is the only source that reflects the Kotlin
      # and Ruby work, because that code lives in the LendingHome org and is
      # never read here.
      #
      # The `projects` and `projects-graphs` sections are deliberately omitted:
      # WakaTime derives project names from local directory names, which would
      # publish employer project names. Languages, time and editors carry no
      # such identifiers.
      #
      # Gated on the secret: without a token the plugin does not fail, it
      # renders a card reading "API error: 401" and commits it. Skipping the
      # step entirely is the only way to avoid publishing that.
      - name: WakaTime
        if: env.HAS_WAKATIME == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          user: gconsentini
          filename: metrics.wakatime.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 30
          plugin_wakatime_limit: 6
          plugin_wakatime_sections: time, languages, editors

      # Open/merged ratio across all pull requests. This reads private data
      # through METRICS_TOKEN, which is why it counts 105 merged PRs rather
      # than the single public one hosted services can see.
      #
      # The lines plugin was removed: it can only see repositories Gustavo
      # owns, so it reported vendored node_modules from old side projects as
      # hundreds of thousands of lines written.
      - name: Activity
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gconsentini
          filename: metrics.activity.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_followup: yes
          plugin_followup_sections: user

      # Isometric commit calendar. Reads the contribution calendar, which
      # includes private contributions as anonymous totals.
      - name: Calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gconsentini
          filename: metrics.calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Coding habits: active hours and days, plus indentation and commit facts.
      - name: Habits
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gconsentini
          filename: metrics.habits.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
