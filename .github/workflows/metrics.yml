name: Metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Languages across public AND private repositories.
      #
      # repositories_affiliations is set to `owner`, so this reads only
      # repositories Gustavo owns. Org-owned repositories (LendingHome) are
      # deliberately excluded: publishing language statistics derived from an
      # employer's private code is a decision to take with the employer first.
      #
      # Forks are skipped explicitly. The elasticsearch fork alone is 558 MB of
      # someone else's Java, which is what made every previous language chart
      # report Java as the primary language.
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gconsentini
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: programming
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_skipped: >-
            elasticsearch,
            RO-calculator,
            calculadoras-ragnarok,
            learn-react,
            challenge-bravo,
            teamsnap-mega-tournament

      # Contribution calendar. This one reflects private work automatically:
      # GitHub exposes private contributions as anonymous counts when
      # "Include private contributions on my profile" is enabled, which it is.
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gconsentini
          filename: metrics.calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
